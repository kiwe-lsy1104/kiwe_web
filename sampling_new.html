<!DOCTYPE html>
<html lang="ko">

<head>
    <script src="js/error_translator.js"></script>
    <meta charset="UTF-8">
    <base href="./">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' https: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://unpkg.com https://*.lucide.dev https://esm.sh https://cdn.jsdelivr.net http://127.0.0.1:* http://localhost:* https://*.esm.sh; img-src 'self' data: https:; font-src 'self' https: data:;">
    <title>시료채취기록대장 (하반기 통합) - KiWE</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        function showError(title, msg) {
            const root = document.getElementById('root');
            if (root) {
                root.innerHTML = `<div style="padding: 40px; text-align: center; font-family: sans-serif; background: #fff1f2; border: 2px solid #fda4af; margin: 20px; border-radius: 12px;">
                    <div style="color: #e11d48; font-size: 24px; font-weight: bold; margin-bottom: 10px;">${title}</div>
                    <div style="color: #4b5563; margin-top: 10px; font-family: monospace; white-space: pre-wrap; font-size: 14px;">${msg}</div>
                    <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #4f46e5; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">새로고침</button>
                    <div style="margin-top: 15px; font-size: 12px; color: #9ca3af;">파일 경로 및 서버 실행 여부를 확인해주세요.</div>
                </div>`;
            }
        }

        window.onerror = function (msg, url, line, col, error) {
            console.error("Global Error:", msg, url, line);
            showError("시스템 로드 오류", `Error: ${msg}\nUrl: ${url}\nLine: ${line}`);
            return false;
        };

        window.addEventListener('unhandledrejection', function (event) {
            console.error("Unhandled Rejection:", event.reason);
            showError("비동기 처리 오류", event.reason?.message || event.reason || "알 수 없는 오류");
        });

        // Catch module loading errors
        window.addEventListener('error', function (event) {
            if (event.target.tagName === 'SCRIPT' && event.target.type === 'module') {
                showError("모듈 로드 실패", `파일을 불러올 수 없습니다: ${event.target.src}\n\n로컬(file://) 환경에서는 보안상 모듈이 작동하지 않을 수 있습니다.\nLive Server 등을 사용하여 실행해주세요.`);
            }
        }, true);
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.css">
    <script src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        .hot-container {
            background-color: #ffffff !important;
            width: 100%;
            height: 600px;
            overflow: hidden;
            border-radius: 0.75rem;
            border: 1px solid #e2e8f0;
        }

        /* Handsontable Center Alignment */
        .handsontable th {
            vertical-align: middle !important;
            text-align: center !important;
            font-weight: 800 !important;
            background-color: #f8fafc !important;
            color: #475569 !important;
            font-size: 11px !important;
        }

        .handsontable td {
            vertical-align: middle !important;
            text-align: center !important;
        }

        .htCenter {
            text-align: center !important;
        }

        .htMiddle {
            vertical-align: middle !important;
        }

        /* 시료채취대장 격자 및 다크모드 방어 */
        .handsontable {
            background-color: #ffffff !important;
            color: #000000 !important;
        }

        .handsontable td {
            background-color: #ffffff !important;
            padding: 0 4px !important;
            line-height: 24px !important;
            height: 24px !important;
            color: #000000 !important;
            border-right: 1px solid #e2e8f0 !important;
            border-bottom: 1px solid #e2e8f0 !important;
            vertical-align: middle !important;
            text-align: center !important;
        }

        /* 유량보정 컬럼 강조 */
        .handsontable td.flow-col {
            background-color: #f0fdf4 !important;
            color: #15803d !important;
        }
        .handsontable th.flow-header {
            background-color: #dcfce7 !important;
            color: #15803d !important;
        }

        /* 격자 스타일 */
        .handsontable tbody tr:nth-child(odd) td {
            background-color: #ffffff !important;
        }
        .handsontable td.hot-row-odd {
            background-color: #f1f5f9 !important;
        }

        /* 테이블 헤더 */
        .handsontable th {
            background-color: #f8fafc !important;
            color: #475569 !important;
            border-right: 1px solid #cbd5e1 !important;
            border-bottom: 1px solid #cbd5e1 !important;
            vertical-align: middle !important;
            text-align: center !important;
            height: 24px !important;
            line-height: 1.1 !important;
        }

        /* 테이블 헤더 글자 밀림 방지 */
        .handsontable th .colHeader {
            white-space: normal !important;
            overflow: visible !important;
            text-overflow: unset !important;
            word-break: keep-all;
            line-height: 1.1;
            padding: 1px;
            color: #475569 !important;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        /* 드롭다운/자동완성 팝업 글자 크기 통일 */
        .handsontableDropdownMenu td,
        .handsontableAutocompleteDropdown td,
        .htAutocomplete .htAutocompleteArrow,
        .handsontable .htSelectEditor option,
        .handsontable .htSelectEditor,
        .listbox ul li,
        .ht_master ~ div .handsontable table td {
            font-size: 11px !important;
            font-family: 'Inter', 'Noto Sans KR', sans-serif !important;
            color: #000 !important;
            white-space: nowrap !important;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }

        .tab-active {
            color: #7c3aed;
            border-bottom: 2px solid #7c3aed;
        }

        .card-custom {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #f1f5f9;
        }

        .input-standard {
            width: 100%;
            padding: 0.5rem 0.75rem;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            outline: none;
            transition: all 0.2s;
        }

        .input-standard:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
            background-color: white;
        }

        .btn-primary {
            background-color: #7c3aed;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary:hover {
            background-color: #6d28d9;
        }

        .modal-overlay {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
        }

        .scroll-custom::-webkit-scrollbar {
            width: 6px;
        }

        .scroll-custom::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .scroll-custom::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* Auto-shrinking text for table cells */
        .auto-shrink {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: clip;
            max-width: 100%;
            cursor: help;
            position: relative;
        }

        @supports (font-size: clamp(8px, 1vw, 14px)) {
            .auto-shrink {
                font-size: clamp(10px, 0.9vw, 14px);
            }
        }

        /* Tooltip for long text */
        .auto-shrink:hover::after {
            content: attr(data-full-text);
            position: absolute;
            left: 0;
            top: 100%;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            white-space: normal;
            max-width: 300px;
            z-index: 1000;
            margin-top: 4px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        /* Text with ellipsis */
        .text-ellipsis {
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            cursor: help;
            position: relative;
        }

        /* Tooltip for ellipsis text */
        .text-ellipsis:hover::after {
            content: attr(data-full-text);
            position: absolute;
            left: 0;
            top: 100%;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            white-space: normal;
            max-width: 300px;
            z-index: 1000;
            margin-top: 4px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        /* Hover effect for rows */
        tr.data-row {
            cursor: pointer;
        }

        tr.data-row:hover {
            background-color: rgba(124, 58, 237, 0.05) !important;
        }

        /* IME Mode Hint for Grid Inputs */
        .handsontable textarea,
        .htCast {
            ime-mode: active !important;
        }

        /* 공시료 경고 모달 */
        .blank-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .blank-modal-box {
            background: white;
            border-radius: 1.5rem;
            padding: 2rem;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            animation: modalIn 0.2s ease-out;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
    <script type="module">
        import { checkAuth } from './js/auth.js';
        checkAuth();
    </script>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen">
    <div id="root">
        <div
            style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 15px; font-family: sans-serif;">
            <div
                style="width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #7c3aed; border-radius: 50%; animation: spin 1s linear infinite;">
            </div>
            <div style="font-weight: bold; color: #475569;">시스템 로딩 중...</div>
            <style>
                @keyframes spin {
                    0% {
                        transform: rotate(0deg);
                    }

                    100% {
                        transform: rotate(360deg);
                    }
                }
            </style>
        </div>
    </div>

    <!-- 공시료 경고 모달 -->
    <div id="blank-warning-modal" class="blank-modal-overlay" style="display:none;">
        <div class="blank-modal-box">
            <div style="display:flex; align-items:center; gap:12px; margin-bottom:1.25rem;">
                <div style="width:44px;height:44px;background:#fef2f2;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                </div>
                <div>
                    <h2 style="font-size:1.125rem;font-weight:900;color:#1e293b;margin:0;">공시료가 부족합니다</h2>
                    <p id="blank-modal-subtitle" style="font-size:0.75rem;color:#94a3b8;margin:4px 0 0;font-weight:600;"></p>
                </div>
            </div>
            <div id="blank-modal-body" style="background:#fef2f2;border:1px solid #fecaca;border-radius:0.75rem;padding:1rem;margin-bottom:1.25rem;font-size:0.8125rem;color:#dc2626;font-weight:700;line-height:1.6;"></div>
            <div style="display:flex;flex-direction:column;gap:0.625rem;">
                <button id="blank-modal-add-btn"
                    style="width:100%;padding:0.75rem;background:linear-gradient(135deg,#7c3aed,#6d28d9);color:white;border:none;border-radius:0.75rem;font-weight:900;font-size:0.9375rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity 0.2s;"
                    onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                    공시료 2건 일괄 생성
                </button>
                <button id="blank-modal-ignore-btn"
                    style="width:100%;padding:0.625rem;background:white;color:#64748b;border:1px solid #e2e8f0;border-radius:0.75rem;font-weight:700;font-size:0.875rem;cursor:pointer;transition:background 0.2s;"
                    onmouseover="this.style.background='#f1f5f9'" onmouseout="this.style.background='white'">
                    무시하고 저장 진행
                </button>
                <button id="blank-modal-cancel-btn"
                    style="width:100%;padding:0.625rem;background:transparent;color:#94a3b8;border:none;border-radius:0.75rem;font-weight:700;font-size:0.8125rem;cursor:pointer;">
                    취소 (돌아가기)
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="./js/sampling_new.js?v=1.0.0"></script>
</body>

</html>
